
name: TalentFlow-AI CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate required frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f 1.png

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  inspect-oidc:
    name: Inspect GitHub OIDC claims
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Request token and print safe claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );

            console.log("Issuer:", payload.iss);
            console.log("Audience:", payload.aud);
            console.log("Subject:", payload.sub);

  deploy:
    name: Deploy static website
    needs:
      - validate
      - inspect-oidc

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: TalentFlowGitHubDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare website files
        run: |
          mkdir -p dist
          cp index.html style.css script.js 1.png dist/

      - name: Upload website to S3
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Verify deployed website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "$SITE_URL" -o /tmp/site.html; then
              if grep -qi '<html' /tmp/site.html; then
                echo "Website deployment verified."
                exit 0
              fi
            fi

            echo "Waiting for website to become available..."
            sleep 10
          done

          echo "Website verification failed."
          exit 1
